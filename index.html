<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo Trade — торговый симулятор</title>
  <style>
    :root{--bg:#09111f;--panel:#111d2e;--panel2:#17243a;--line:#26374f;--text:#edf4ff;--muted:#91a2b8;--green:#22c55e;--red:#ef4444;--blue:#3b82f6}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif} button,input,select{font:inherit}
    button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:220px minmax(360px,1fr) 300px}.sidebar,.trade-panel{background:var(--panel);border-right:1px solid var(--line);padding:18px}.trade-panel{border-right:0;border-left:1px solid var(--line)}
    .sidebar{position:relative}.logo{font-weight:800;font-size:20px;margin-bottom:22px}.logo span{color:var(--blue)}.demo-badge{display:inline-block;margin-left:6px;padding:3px 7px;border-radius:99px;background:#1d3b68;color:#91bfff;font-size:11px}
    .market{width:100%;display:flex;justify-content:space-between;align-items:center;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--text);padding:13px 8px}.market.active{background:var(--panel2);border-radius:8px}.market small{display:block;color:var(--muted);margin-top:3px}.up{color:var(--green)}.down{color:var(--red)}
    main{min-width:0}.topbar{height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px}.pair{font-size:20px;font-weight:800}.pair-price{margin-left:12px;font-family:ui-monospace,monospace}.muted{color:var(--muted)}
    .chart-wrap{height:430px;padding:14px}canvas{width:100%;height:100%;display:block}.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}.stat{padding:13px 20px;border-right:1px solid var(--line)}.stat:last-child{border-right:0}.stat label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.stat b{font-family:ui-monospace,monospace}
    .tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--panel2);border-radius:8px;padding:4px;margin-bottom:16px}.tabs button{border:0;border-radius:6px;padding:9px;color:var(--muted);background:transparent}.tabs button.active.buy{background:var(--green);color:white}.tabs button.active.sell{background:var(--red);color:white}
    .field{margin-bottom:12px}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.field input,.field select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:11px}
    .quick{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:14px}.quick button{border:1px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:6px;padding:7px}.order-btn{width:100%;border:0;border-radius:8px;padding:12px;color:white;font-weight:800}.order-btn.buy{background:var(--green)}.order-btn.sell{background:var(--red)}
    .warning{margin-top:16px;padding:11px;border:1px solid #5a4a21;background:#332916;border-radius:8px;color:#d9c493;font-size:12px;line-height:1.45}.balance{margin-top:18px}.balance-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}.balance-row span{color:var(--muted)}
    .bottom{border-top:1px solid var(--line);height:190px;padding:14px 20px}.bottom h3{margin:0 0 8px;font-size:13px;color:var(--muted);text-transform:uppercase}.positions{display:flex;gap:10px;overflow:auto}.position,.history-item{min-width:180px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:12px}.history-item{min-width:210px}.position b,.history-item b{display:block;margin-bottom:5px}.muted-text{color:var(--muted)}
    .reset{position:absolute;left:18px;bottom:18px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:7px;padding:8px 10px}
    @media(max-width:900px){.app{grid-template-columns:150px 1fr}.trade-panel{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}.chart-wrap{height:360px}.stats{grid-template-columns:repeat(3,1fr)}}
    @media(max-width:620px){.app{display:block}.sidebar{min-height:auto}.market{max-width:none}.chart-wrap{height:300px}.stats{grid-template-columns:1fr}.stat{border-right:0;border-bottom:1px solid var(--line)}.topbar{height:auto;min-height:76px}.reset{position:static;margin-top:14px}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="logo">Demo<span>Trade</span><span class="demo-badge">DEMO</span></div>
      <div id="markets"></div>
      <button class="reset" id="reset">Сбросить счёт</button>
    </aside>
    <main>
      <header class="topbar">
        <div><span class="pair" id="pairName">BTC/USDT</span><span class="pair-price" id="pairPrice">—</span></div>
        <span id="marketStatus" class="muted">Симуляция запущена</span>
      </header>
      <div class="chart-wrap"><canvas id="chart"></canvas></div>
      <div class="stats">
        <div class="stat"><label>Виртуальный капитал</label><b id="equity">$10,000.00</b></div>
        <div class="stat"><label>Свободные USDT</label><b id="cash">$10,000.00</b></div>
        <div class="stat"><label>Нереализованный P/L</label><b id="pnl">$0.00</b></div>
      </div>
      <section class="bottom"><h3>Открытые позиции</h3><div class="positions" id="positions"></div></section>
      <section class="bottom"><h3>История сделок</h3><div class="positions" id="history"></div></section>
    </main>
    <aside class="trade-panel">
      <div class="tabs"><button id="buyTab" class="active buy">Купить</button><button id="sellTab">Продать</button></div>
      <div class="field"><label for="orderType">Тип ордера</label><select id="orderType"><option value="market">Рыночный</option><option value="limit">Лимитный</option></select></div>
      <div class="field" id="priceField" style="display:none"><label for="price">Цена</label><input id="price" type="number" min="0.000001" step="0.01"></div>
      <div class="field"><label for="qty">Количество</label><input id="qty" type="number" min="0.000001" step="0.001" value="0.01"></div>
      <div class="quick"><button data-pct="0.25">25%</button><button data-pct="0.5">50%</button><button data-pct="0.75">75%</button><button data-pct="1">100%</button></div>
      <button class="order-btn buy" id="submit">Купить</button>
      <div class="warning"><b>Учебная среда.</b><br>Все средства виртуальные. Цены и сделки не связаны с реальной биржей.</div>
      <div class="balance"><div class="balance-row"><span>Активы</span><b id="assetsValue">—</b></div></div>
    </aside>
  </div>
<script>
'use strict';
const STORAGE_KEY='demo-trade-state';
const INITIAL_MARKETS=[
  {symbol:'BTC/USDT',base:'BTC',initialPrice:67432,price:67432,volatility:.0012},
  {symbol:'ETH/USDT',base:'ETH',initialPrice:3456,price:3456,volatility:.0015},
  {symbol:'SOL/USDT',base:'SOL',initialPrice:148.25,price:148.25,volatility:.002}
];
const MARKETS=INITIAL_MARKETS.map(m=>({...m}));
const freshState=()=>({market:0,cash:10000,positions:{},orders:[],history:[],candles:{}});
let state=freshState();
try{const parsed=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(parsed&&typeof parsed.cash==='number'&&parsed.positions&&Array.isArray(parsed.orders)&&Array.isArray(parsed.history)){state={...freshState(),...parsed,candles:parsed.candles&&typeof parsed.candles==='object'?parsed.candles:{}}}}catch(e){state=freshState()}
MARKETS.forEach((m,i)=>{m.price=[67432,3456,148.25][i]});
const $=id=>document.getElementById(id);
function market(){return MARKETS[state.market]||MARKETS[0]}
function fmt(n){return '$'+Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
function initCandles(){state.candles=state.candles&&typeof state.candles==='object'?state.candles:{};MARKETS.forEach((m,index)=>{if(Array.isArray(state.candles[m.base])&&state.candles[m.base].length)return;let p=m.initialPrice;const candles=[];for(let i=0;i<90;i++){const o=p;p=o+(Math.random()-.48)*o*m.volatility*2;const h=Math.max(o,p)*(1+Math.random()*.001);const l=Math.min(o,p)*(1-Math.random()*.001);candles.push({open:o,close:p,high:h,low:l})}state.candles[m.base]=candles})}
initCandles();
function renderMarkets(){const el=$('markets');el.innerHTML=MARKETS.map((m,i)=>{const change=((m.price-m.initialPrice)/m.initialPrice)*100;return `<button class="market ${state.market===i?'active':''}" data-i="${i}"><div><b>${m.base}</b><small>${m.symbol}</small></div><div class="${change>=0?'up':'down'}">${fmt(m.price)}<small>${change>=0?'+':''}${change.toFixed(2)}%</small></div></button>`}).join('');el.querySelectorAll('.market').forEach(b=>b.onclick=()=>{state.market=Number(b.dataset.i);$('price').value=market().price.toFixed(2);render()})}
let side='buy';
$('buyTab').onclick=()=>setSide('buy');$('sellTab').onclick=()=>setSide('sell');
function setSide(s){side=s;document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active','buy','sell'));const b=$(s+'Tab');b.classList.add('active',s);const submit=$('submit');submit.className='order-btn '+s;submit.textContent=(s==='buy'?'Купить ':'Продать ') + market().base}
$('orderType').onchange=e=>{$('priceField').style.display=e.target.value==='limit'?'block':'none'};
function assetValue(){let v=0;Object.entries(state.positions).forEach(([base,p])=>{const m=MARKETS.find(x=>x.base===base);if(m&&p&&p.qty>0)v+=p.qty*m.price});return v}
function pnl(){let v=0;Object.entries(state.positions).forEach(([base,p])=>{const m=MARKETS.find(x=>x.base===base);if(m&&p)v+=(m.price-p.avg)*p.qty});return v}
document.querySelectorAll('.quick button').forEach(b=>b.onclick=()=>{const pct=+b.dataset.pct;if(side==='buy'){const price=+$('price').value||market().price;$('qty').value=(state.cash*pct/price).toFixed(6)}else{const q=state.positions[market().base]?.qty||0;$('qty').value=(q*pct).toFixed(6)}});
$('submit').onclick=()=>{const m=market();const qty=+$('qty').value;const type=$('orderType').value;const limit=+$('price').value;if(!Number.isFinite(qty)||qty<=0)return alert('Введите корректное количество');if(type==='limit'&&(!Number.isFinite(limit)||limit<=0))return alert('Введите корректную цену');if(type==='limit'){const crosses=side==='buy'&&limit>=m.price||side==='sell'&&limit<=m.price;if(crosses){execute(side,qty,side==='buy'?m.price:limit,m.base)}else{state.orders.push({id:Date.now()+Math.random(),base:m.base,side,qty,price:limit,originalQty:qty};save();render();}}else execute(side,qty,m.price,m.base)};
function execute(side,qty,price,base){const m=MARKETS.find(x=>x.base===base);if(!m||!Number.isFinite(qty)||qty<=0)return;if(side==='buy'){const cost=qty*price;if(cost>state.cash)return alert('Недостаточно виртуального USDT');state.cash-=cost;const p=state.positions[base]||{qty:0,avg:0};p.avg=(p.qty*p.avg+qty*price)/(p.qty+qty);p.qty+=qty;state.positions[base]=p}else{const p=state.positions[base];if(!p||p.qty+1e-9<qty)return alert('Недостаточно активов');p.qty-=qty;if(p.qty<1e-8)delete state.positions[base];else state.positions[base]=p;state.cash+=qty*price}state.history.unshift({time:new Date().toLocaleTimeString(),side,qty,price,base});state.history=state.history.slice(20);save();render()}
function render(){const m=market();$('pairName').textContent=m.symbol;$('pairPrice').textContent=fmt(m.price);$('cash').textContent=fmt(state.cash);const av=assetValue(),equity=state.cash+av;$('assetsValue').textContent=fmt(av);$('equity').textContent=fmt(equity);const pl=pnl();$('pnl').textContent=(pl>=0?'+$':'-$')+Math.abs(pl).toFixed(2);$('pnl').className=pl>=0?'up':'down';$('price').value=Number($('price').value)>0?$('price').value:m.price.toFixed(2);setSide(side);renderMarkets();renderPositions();renderHistory();drawChart()}
function renderPositions(){const el=$('positions');const entries=Object.entries(state.positions);el.innerHTML=entries.length?entries.map(([base,p])=>{const m=MARKETS.find(x=>x.base===base);const pl=m?(m.price-p.avg)*p.qty:0;return `<div class="position"><b>${base}</b><div>${p.qty.toFixed(6)} шт.</div><div class="muted-text">Средняя: ${fmt(p.avg)}</div><div class="${pl>=0?'up':'down'}">P/L: ${fmt(pl)}</div></div>`}).join(''):'<span class="muted-text">Позиций нет</span>'}
function renderHistory(){const el=$('history');el.innerHTML=state.history.length?state.history.map(h=>`<div class="history-item"><b class="${h.side==='buy'?'up':'down'}">${h.side==='buy'?'ПОКУПКА':'ПРОДАЖА'} ${h.base}</b><div>${h.qty.toFixed(6)} × ${fmt(h.price)}</div><div class="muted-text">${h.time}</div></div>`).join(''):'<span class="muted-text">Сделок нет</span>'}
const canvas=$('chart'),ctx=canvas.getContext('2d');
function drawChart(){if(!ctx)return;const dpr=devicePixelRatio||1,r=canvas.getBoundingClientRect();canvas.width=r.width*dpr;canvas.height=r.height*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,r.width,r.height);const c=state.candles[market().base]||[];if(!c.length)return;const w=r.width,h=r.height,pad=8,cw=(w-pad*2)/c.length;const highs=c.map(x=>x.high),lows=c.map(x=>x.low),max=Math.max(...highs),min=Math.min(...lows),range=max-min||1;ctx.strokeStyle='#26374f';ctx.lineWidth=1;for(let i=0;i<5;i++){const y=pad+i*(h-pad*2)/4;ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(w-pad,y);ctx.stroke()}const yv=x=>pad+(max-x)/range*(h-pad*2);c.forEach((x,i)=>{const x0=pad+i*cw,up=x.close>=x.open;ctx.strokeStyle=up?'#22c55e':'#ef4444';ctx.fillStyle=up?'#22c55e':'#ef4444';ctx.beginPath();ctx.moveTo(x0+cw/2,yv(x.high));ctx.lineTo(x0+cw/2,yv(x.low));ctx.stroke();ctx.fillRect(x0+cw*.2,yv(Math.max(x.open,x.close)),Math.max(2,cw*.6),Math.max(2,Math.abs(yv(x.open)-yv(x.close))))})}
setInterval(()=>{MARKETS.forEach(m=>{const move=(Math.random()-.495)*m.volatility;m.price=Math.max(.01,m.price*(1+move))});const m=market(),c=state.candles[m.base]||[];const last=c.at(-1),base=last?last.close:m.price;const open=base,close=m.price,high=Math.max(open,close)*(1+Math.random()*.001),low=Math.min(open,close)*(1-Math.random()*.001);c.push({open,close,high,low});if(c.length>90)c.shift();state.candles[m.base]=c;for(let i=state.orders.length-1;i>=0;i--){const o=state.orders[i];const om=MARKETS.find(x=>x.base===o.base);if(!om)continue;if(o.side==='buy'&&om.price<=o.price||o.side==='sell'&&om.price>=o.price){execute(o.side,o.qty,o.price,o.base);state.orders.splice(i,1)}}save();render()},2500);
$('reset').onclick=()=>{if(!confirm('Сбросить весь учебный счёт?'))return;state=freshState();MARKETS.forEach((m,i)=>{m.price=[67432,3456,148.25][i]});initCandles();save();render()};
window.addEventListener('resize',drawChart);render();
</script>
</body>
</html>
