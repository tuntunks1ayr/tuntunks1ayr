<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo Trade — торговый симулятор</title>
  <style>
    :root{--bg:#09111f;--panel:#111d2e;--panel2:#17243a;--line:#26374f;--text:#edf4ff;--muted:#91a2b8;--green:#22c55e;--red:#ef4444;--blue:#3b82f6}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer}
    .app{min-height:100vh;display:grid;grid-template-columns:220px minmax(0,1fr) 300px}.sidebar,.trade-panel{background:var(--panel);padding:18px}.sidebar{border-right:1px solid var(--line);position:relative}.trade-panel{border-left:1px solid var(--line)}
    .logo{font-weight:800;font-size:20px;margin-bottom:20px}.logo span{color:var(--blue)}.badge{font-size:11px;background:#1d3b68;color:#91bfff;padding:3px 7px;border-radius:20px;margin-left:5px}
    .market{width:100%;display:flex;justify-content:space-between;text-align:left;align-items:center;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--text);padding:12px 8px}.market.active{background:var(--panel2);border-radius:8px}.market small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.up{color:var(--green)}.down{color:var(--red)}
    main{min-width:0}.topbar{min-height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:12px 20px;gap:12px}.pair{font-size:20px;font-weight:800}.pair-price{margin-left:12px;font-family:monospace}.muted{color:var(--muted)}.chart-wrap{height:400px;padding:14px}canvas{width:100%;height:100%;display:block}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}.stat{padding:13px 18px;border-right:1px solid var(--line)}.stat:last-child{border:0}.stat label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}
    .bottom{border-top:1px solid var(--line);min-height:150px;padding:14px 20px}.bottom h3{margin:0 0 10px;font-size:13px;color:var(--muted);text-transform:uppercase}.items{display:flex;gap:10px;overflow:auto}.card{min-width:180px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:12px}.card b{display:block;margin-bottom:5px}
    .tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--panel2);border-radius:8px;padding:4px;margin-bottom:16px}.tabs button{border:0;border-radius:6px;padding:9px;color:var(--muted);background:transparent}.tabs .active.buy,.order-btn.buy{background:var(--green);color:white}.tabs .active.sell,.order-btn.sell{background:var(--red);color:white}
    .field{margin-bottom:12px}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.field input,.field select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:10px}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:14px}.quick button,.reset{border:1px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:6px;padding:7px}.order-btn{width:100%;border:0;border-radius:8px;padding:12px;font-weight:800}.warning{margin-top:16px;padding:11px;border:1px solid #5a4a21;background:#332916;border-radius:8px;color:#d9c493;font-size:12px;line-height:1.45}.balance{margin-top:18px}.balance-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}.reset{margin-top:20px}
    @media(max-width:900px){.app{grid-template-columns:150px minmax(0,1fr)}.trade-panel{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}.chart-wrap{height:340px}}
    @media(max-width:620px){.app{display:block}.sidebar{min-height:auto}.reset{margin-top:12px}.chart-wrap{height:280px}.stats{grid-template-columns:1fr}.stat{border-right:0;border-bottom:1px solid var(--line)}.topbar{align-items:flex-start;flex-direction:column}.bottom{min-height:120px}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar"><div class="logo">Demo<span>Trade</span><span class="badge">DEMO</span></div><div id="markets"></div><button class="reset" id="reset">Сбросить счёт</button></aside>
    <main>
      <header class="topbar"><div><span class="pair" id="pairName"></span><span class="pair-price" id="pairPrice"></span></div><span class="muted">Симуляция запущена</span></header>
      <div class="chart-wrap"><canvas id="chart" aria-label="Учебный график цены"></canvas></div>
      <div class="stats"><div class="stat"><label>Виртуальный капитал</label><b id="equity"></b></div><div class="stat"><label>Свободные USDT</label><b id="cash"></b></div><div class="stat"><label>Нереализованный P/L</label><b id="pnl"></b></div></div>
      <section class="bottom"><h3>Открытые позиции</h3><div class="items" id="positions"></div></section>
      <section class="bottom"><h3>История сделок</h3><div class="items" id="history"></div></section>
    </main>
    <aside class="trade-panel">
      <div class="tabs"><button id="buyTab" class="active buy">Купить</button><button id="sellTab">Продать</button></div>
      <div class="field"><label for="orderType">Тип ордера</label><select id="orderType"><option value="market">Рыночный</option><option value="limit">Лимитный</option></select></div>
      <div class="field" id="priceField" hidden><label for="price">Цена</label><input id="price" type="number" min="0.000001" step="0.01"></div>
      <div class="field"><label for="qty">Количество</label><input id="qty" type="number" min="0.000001" step="0.001" value="0.01"></div>
      <div class="quick"><button data-pct="0.25">25%</button><button data-pct="0.5">50%</button><button data-pct="0.75">75%</button><button data-pct="1">100%</button></div>
      <button class="order-btn buy" id="submit">Купить</button>
      <div class="warning"><b>Учебная среда.</b><br>Все средства виртуальные. Цены и сделки не связаны с реальной биржей.</div>
      <div class="balance"><div class="balance-row"><span>Активы</span><b id="assetsValue"></b></div><div class="balance-row"><span>Лимитные ордера</span><b id="orderCount"></b></div></div>
    </aside>
  </div>
<script>
'use strict';
const STORAGE_KEY='demo-trade-state';
const INITIAL_MARKETS=[{symbol:'BTC/USDT',base:'BTC',price:67432,volatility:.0012},{symbol:'ETH/USDT',base:'ETH',price:3456,volatility:.0015},{symbol:'SOL/USDT',base:'SOL',price:148.25,volatility:.002}];
const markets=INITIAL_MARKETS.map(m=>({...m,initialPrice:m.price}));
const freshState=()=>({market:0,cash:10000,positions:{},orders:[],history:[],candles:{}});
let state=freshState();
try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(saved&&Number.isFinite(saved.cash)&&saved.positions&&Array.isArray(saved.orders)&&Array.isArray(saved.history))state={...freshState(),...saved,candles:saved.candles&&typeof saved.candles==='object'?saved.candles:{}}}catch(error){state=freshState()}
state.market=Number.isInteger(state.market)&&state.market>=0&&state.market<markets.length?state.market:0;
const $=id=>document.getElementById(id);
const fmt=n=>'$'+Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const market=()=>markets[state.market];
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(error){console.warn('Could not save simulator state',error)}}
function initCandles(){state.candles=state.candles||{};markets.forEach(m=>{if(Array.isArray(state.candles[m.base])&&state.candles[m.base].length)return;let p=m.price;const candles=[];for(let i=0;i<60;i++){const open=p;p=Math.max(.01,open+(Math.random()-.5)*open*m.volatility*2);candles.push({open,close:p,high:Math.max(open,p)*1.001,low:Math.min(open,p)*.999})}state.candles[m.base]=candles})}
initCandles();
let side='buy';
function setSide(next){side=next;for(const name of ['buy','sell'])$(name+'Tab').className=name===side?'active '+name:'';$('submit').className='order-btn '+side;$('submit').textContent=(side==='buy'?'Купить ':'Продать ')+market().base}
$('buyTab').onclick=()=>setSide('buy');$('sellTab').onclick=()=>setSide('sell');
$('orderType').onchange=()=>{$('priceField').hidden=$('orderType').value!=='limit';$('price').value=market().price.toFixed(2)};
function assetValue(){return Object.entries(state.positions).reduce((sum,[base,p])=>{const m=markets.find(x=>x.base===base);return sum+(m&&p?m.price*p.qty:0)},0)}
function unrealized(){return Object.entries(state.positions).reduce((sum,[base,p])=>{const m=markets.find(x=>x.base===base);return sum+(m&&p?(m.price-p.avg)*p.qty:0)},0)}
function execute(order,price){const {base,qty,side:tradeSide}=order;const p=state.positions[base]||{qty:0,avg:0};if(tradeSide==='buy'){const cost=qty*price;if(cost>state.cash)return false;state.cash-=cost;p.avg=(p.qty*p.avg+qty*price)/(p.qty+qty);p.qty+=qty;state.positions[base]=p}else{if(p.qty+1e-9<qty)return false;p.qty-=qty;if(p.qty<1e-8)delete state.positions[base];else state.positions[base]=p;state.cash+=qty*price}state.history.unshift({time:new Date().toLocaleTimeString(),side:tradeSide,qty,price,base});state.history=state.history.slice(0,30);return true}
function renderMarkets(){$('markets').innerHTML=markets.map((m,i)=>{const change=(m.price-m.initialPrice)/m.initialPrice*100;return `<button class="market ${i===state.market?'active':''}" data-index="${i}"><span><b>${m.base}</b><small>${m.symbol}</small></span><span class="${change>=0?'up':'down'}">${fmt(m.price)}<small>${change>=0?'+':''}${change.toFixed(2)}%</small></span></button>`}).join('');document.querySelectorAll('.market').forEach(button=>button.onclick=()=>{state.market=Number(button.dataset.index);$('price').value=market().price.toFixed(2);setSide(side);render()})}
function renderPositions(){const entries=Object.entries(state.positions);$('positions').innerHTML=entries.length?entries.map(([base,p])=>{const m=markets.find(x=>x.base===base);const pl=m?(m.price-p.avg)*p.qty:0;return `<div class="card"><b>${base}</b><div>${p.qty.toFixed(6)} шт.</div><div class="muted">Средняя: ${fmt(p.avg)}</div><div class="${pl>=0?'up':'down'}">P/L: ${fmt(pl)}</div></div>`}).join(''):'<span class="muted">Пока нет открытых позиций</span>'}
function renderHistory(){$('history').innerHTML=state.history.length?state.history.map(h=>`<div class="card"><b class="${h.side==='buy'?'up':'down'}">${h.side==='buy'?'ПОКУПКА':'ПРОДАЖА'} ${h.base}</b><div>${h.qty.toFixed(6)} × ${fmt(h.price)}</div><div class="muted">${h.time}</div></div>`).join(''):'<span class="muted">Сделок ещё нет</span>'}
const canvas=$('chart'),ctx=canvas.getContext('2d');
function drawChart(){if(!ctx)return;const rect=canvas.getBoundingClientRect(),dpr=window.devicePixelRatio||1;canvas.width=Math.max(1,rect.width*dpr);canvas.height=Math.max(1,rect.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,rect.width,rect.height);const candles=state.candles[market().base]||[];if(!candles.length)return;const pad=8,w=rect.width,h=rect.height,cw=(w-pad*2)/candles.length,max=Math.max(...candles.map(c=>c.high)),min=Math.min(...candles.map(c=>c.low)),range=max-min||1,y=value=>pad+(max-value)/range*(h-pad*2);ctx.strokeStyle='#26374f';for(let i=0;i<5;i++){const gy=pad+i*(h-pad*2)/4;ctx.beginPath();ctx.moveTo(pad,gy);ctx.lineTo(w-pad,gy);ctx.stroke()}candles.forEach((c,i)=>{const x=pad+i*cw,color=c.close>=c.open?'#22c55e':'#ef4444';ctx.strokeStyle=color;ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(x+cw/2,y(c.high));ctx.lineTo(x+cw/2,y(c.low));ctx.stroke();const top=y(Math.max(c.open,c.close)),bottom=y(Math.min(c.open,c.close));ctx.fillRect(x+cw*.2,top,Math.max(1,cw*.6),Math.max(1,bottom-top))})}
function render(){const m=market(),pl=unrealized(),assets=assetValue();$('pairName').textContent=m.symbol;$('pairPrice').textContent=fmt(m.price);$('cash').textContent=fmt(state.cash);$('assetsValue').textContent=fmt(assets);$('equity').textContent=fmt(state.cash+assets);$('pnl').textContent=(pl>=0?'+':'−')+fmt(Math.abs(pl));$('pnl').className=pl>=0?'up':'down';$('orderCount').textContent=state.orders.length;$('price').value=Number($('price').value)>0?$('price').value:m.price.toFixed(2);setSide(side);renderMarkets();renderPositions();renderHistory();drawChart()}
document.querySelectorAll('.quick button').forEach(button=>button.onclick=()=>{const pct=Number(button.dataset.pct);if(side==='buy'){$('qty').value=(state.cash*pct/(Number($('price').value)||market().price)).toFixed(6)}else{$('qty').value=((state.positions[market().base]?.qty||0)*pct).toFixed(6)}});
$('submit').onclick=()=>{const qty=Number($('qty').value),type=$('orderType').value,limit=Number($('price').value),m=market();if(!Number.isFinite(qty)||qty<=0)return alert('Введите корректное количество');if(type==='limit'&&(!Number.isFinite(limit)||limit<=0))return alert('Введите корректную цену');const order={base:m.base,side,qty,price:type==='limit'?limit:m.price};if(side==='buy'&&qty*order.price>state.cash)return alert('Недостаточно виртуальных USDT');if(side==='sell'&&(!state.positions[m.base]||qty>state.positions[m.base].qty))return alert('Недостаточно актива');if(type==='limit'&&((side==='buy'&&limit<m.price)||(side==='sell'&&limit>m.price))){state.orders.push({...order,id:Date.now()+Math.random()});save();render();return}if(execute(order,order.price)){save();render()}};
setInterval(()=>{markets.forEach(m=>{m.price=Math.max(.01,m.price*(1+(Math.random()-.5)*m.volatility))});const m=market(),candles=state.candles[m.base],last=candles[candles.length-1],open=last?last.close:m.price; candles.push({open,close:m.price,high:Math.max(open,m.price)*1.001,low:Math.min(open,m.price)*.999});if(candles.length>60)candles.shift();for(let i=state.orders.length-1;i>=0;i--){const o=state.orders[i],om=markets.find(x=>x.base===o.base);if(!om)continue;const triggered=o.side==='buy'?om.price<=o.price:om.price>=o.price;if(triggered&&execute(o,o.price))state.orders.splice(i,1)}save();render()},2500);
$('reset').onclick=()=>{if(!confirm('Сбросить весь учебный счёт?'))return;state=freshState();markets.forEach((m,i)=>m.price=INITIAL_MARKETS[i].price);initCandles();save();render()};
window.addEventListener('resize',drawChart);render();
</script>
</body>
</html>
